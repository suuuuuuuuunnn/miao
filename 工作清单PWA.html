/* ══════════════════════════════════════
   Toast System
══════════════════════════════════════ */
const toastContainer = document.getElementById('toastContainer');

function showToast(message, options = {}) {
  const { undoCallback, duration = 5000 } = options;
  const toast = document.createElement('div');
  toast.className = 'toast';

  if (undoCallback) {
    // Circle countdown SVG
    const circumference = 2 * Math.PI * 12; // r=12
    let remaining = duration;
    toast.innerHTML = `
      <div class="toast-countdown">
        <svg viewBox="0 0 28 28"><circle cx="14" cy="14" r="12" style="stroke-dasharray:${circumference};stroke-dashoffset:0;transition:stroke-dashoffset ${duration}ms linear;"></circle></svg>
        <span class="countdown-num">${Math.ceil(duration / 1000)}</span>
      </div>
      <span>${message}</span>
      <button class="toast-undo">撤销</button>`;

    const circle = toast.querySelector('svg circle');
    const numEl = toast.querySelector('.countdown-num');
    requestAnimationFrame(() => { circle.style.strokeDashoffset = circumference; });

    const undoBtn = toast.querySelector('.toast-undo');
    let undone = false;
    undoBtn.addEventListener('click', () => {
      undone = true;
      clearTimeout(timer);
      clearInterval(countdownInterval);
      undoCallback();
      dismissToast(toast);
    });

    const countdownInterval = setInterval(() => {
      remaining -= 1000;
      if (remaining <= 0) remaining = 0;
      numEl.textContent = Math.ceil(remaining / 1000);
    }, 1000);

    const timer = setTimeout(() => {
      clearInterval(countdownInterval);
      if (!undone) dismissToast(toast);
    }, duration);
  } else {
    toast.innerHTML = `<span>${message}</span>`;
    setTimeout(() => dismissToast(toast), 2500);
  }

  toastContainer.appendChild(toast);
}

function dismissToast(toast) {
  toast.classList.add('out');
  toast.addEventListener('animationend', () => toast.remove());
}

      if (!data.tasks || !Array.isArray(data.tasks)) {
        showToast('⚠️ 文件格式不正确');
        return;
      }
      // Merge tasks: use id as dedup key
      const existingIds = new Set(tasks.map(t => t.id));
      const newTasks = data.tasks.filter(t => !existingIds.has(t.id));
      tasks = [...data.tasks, ...newTasks];

      // Import memos
      if (data.memos && Array.isArray(data.memos)) {
        const existingMemos = JSON.parse(localStorage.getItem('app_memos') || '[]');
        const existingMemoIds = new Set(existingMemos.map(m => m.id));
        const newMemos = data.memos.filter(m => !existingMemoIds.has(m.id));
        localStorage.setItem('app_memos', JSON.stringify([...existingMemos, ...newMemos]));
      }

      // Import expanded tasks
      if (data.expandedTasks && Array.isArray(data.expandedTasks)) {
        data.expandedTasks.forEach(id => expandedTasks.add(id));
      }

      save();
      render();
      showToast(`📥 已导入 ${data.tasks.length} 条任务`);
    } catch (err) {
      showToast('⚠️ 解析文件失败');
    }
  };
  reader.readAsText(file);
  importFileInput.value = '';
});

/* ══════════════════════════════════════
   Simple Markdown Renderer
══════════════════════════════════════ */
function renderMarkdown(text) {
  if (!text) return '';
  let html = escapeHtml(text);
  // Code blocks (``` ... ```)
  html = html.replace(/```([\s\S]*?)```/g, (_, code) => {
    return `<pre><code>${code.trim()}</code></pre>`;
  });
  // Inline code
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  // Bold
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // Italic
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
  // Strikethrough
  html = html.replace(/~~(.+?)~~/g, '<del>$1</del>');
  // Headings
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  // Horizontal rule
  html = html.replace(/^---$/gm, '<hr>');
  // Blockquote
  html = html.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');
  // Unordered list items
  html = html.replace(/^[\-\*] (.+)$/gm, '<li>$1</li>');
  html = html.replace(/((?:<li>.*<\/li>\n?)+)/g, '<ul>$1</ul>');
  // Ordered list items
  html = html.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
  // Links
  html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  // Line breaks → paragraphs
  html = html.replace(/\n\n/g, '</p><p>');
  html = html.replace(/\n/g, '<br>');
  html = '<p>' + html + '</p>';
  // Clean up empty paragraphs
  html = html.replace(/<p>\s*<\/p>/g, '');
  html = html.replace(/<p>(<h[123]>)/g, '$1');
  html = html.replace(/(<\/h[123]>)<\/p>/g, '$1');
  html = html.replace(/<p>(<pre>)/g, '$1');
  html = html.replace(/(<\/pre>)<\/p>/g, '$1');
  html = html.replace(/<p>(<ul>)/g, '$1');
  html = html.replace(/(<\/ul>)<\/p>/g, '$1');
  html = html.replace(/<p>(<blockquote>)/g, '$1');
  html = html.replace(/(<\/blockquote>)<\/p>/g, '$1');
  html = html.replace(/<p>(<hr>)/g, '$1');
  html = html.replace(/(<hr>)<\/p>/g, '$1');
  return html;
}

function applySearchFilter() {
  const items = taskList.querySelectorAll('.task-item');
  if (!searchQuery) {
    items.forEach(item => {
      item.classList.remove('search-dimmed', 'search-highlight');
    });
    return;
  }
  items.forEach(item => {
    const id = Number(item.dataset.id);
    const t = tasks.find(t => t.id === id);
    if (!t) return;
    const match = t.text.toLowerCase().includes(searchQuery) ||
                  (t.note && t.note.toLowerCase().includes(searchQuery));
    item.classList.toggle('search-dimmed', !match);
    item.classList.toggle('search-highlight', match);
  });
}

(function () {
  const MEMO_KEY = 'app_memos';

  /* ── 分类配置 ── */
  const CATS = {
    work:  { label: '工作', badge: 'badge-work',  icon: '💼' },
    life:  { label: '生活', badge: 'badge-life',  icon: '🌿' },
    idea:  { label: '想法', badge: 'badge-idea',  icon: '💡' },
    data:  { label: '数据', badge: 'badge-data',  icon: '📊' },
    other: { label: '其他', badge: 'badge-other', icon: '📌' },
  };

  /* ── 数据存取 ── */
  function loadMemos() {
    try { return JSON.parse(localStorage.getItem(MEMO_KEY) || '[]'); }
    catch (_) { return []; }
  }
  function saveMemos(list) {
    localStorage.setItem(MEMO_KEY, JSON.stringify(list));
  }

  /* ── 工具函数 ── */
  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  }
  function fmtTime(ts) {
    const d = new Date(ts);
    const Y = d.getFullYear(), M = d.getMonth()+1, D = d.getDate();
    const h = String(d.getHours()).padStart(2,'0'), m = String(d.getMinutes()).padStart(2,'0');
    const now = new Date();
    if (Y === now.getFullYear() && M === now.getMonth()+1 && D === now.getDate()) {
      return `今天 ${h}:${m}`;
    }
    return `${M}/${D} ${h}:${m}`;
  }
  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  /* ── DOM 引用 ── */
  const fab        = document.getElementById('memoFab');
  const mask       = document.getElementById('memoMask');
  const drawer     = document.getElementById('memoDrawer');
  const closeBtn   = document.getElementById('memoClose');
  const tagBtns    = document.querySelectorAll('.memo-tags .memo-tag');
  const titleInput = document.getElementById('memoTitleInput');
  const bodyInput  = document.getElementById('memoBodyInput');
  const catSelect  = document.getElementById('memoCatSelect');
  const addBtn     = document.getElementById('memoAddBtn');
  const listEl     = document.getElementById('memoList');

  let currentCat = 'all';

  /* ── 抽屉开关 ── */
  function openDrawer() {
    mask.classList.add('open');
    drawer.classList.add('open');
    titleInput.focus();
  }
  function closeDrawer() {
    mask.classList.remove('open');
    drawer.classList.remove('open');
  }
  fab.addEventListener('click', openDrawer);
  closeBtn.addEventListener('click', closeDrawer);
  mask.addEventListener('click', closeDrawer);

  /* ── 分类筛选 ── */
  tagBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      tagBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentCat = btn.dataset.cat;
      renderList();
    });
  });

  /* ── 添加备忘 ── */
  function addMemo() {
    const title = titleInput.value.trim();
    if (!title) {
      titleInput.focus();
      titleInput.style.borderColor = '#e07aaa';
      setTimeout(() => titleInput.style.borderColor = '', 1200);
      return;
    }
    const list = loadMemos();
    list.unshift({
      id: uid(),
      title,
      body: bodyInput.value.trim(),
      cat: catSelect.value,
      createdAt: Date.now(),
      updatedAt: Date.now(),
    });
    saveMemos(list);
    titleInput.value = '';
    bodyInput.value  = '';
    renderList();
  }
  addBtn.addEventListener('click', addMemo);
  titleInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); addMemo(); }
  });

  /* ── 删除 ── */
  function deleteMemo(id) {
    const list = loadMemos().filter(m => m.id !== id);
    saveMemos(list);
    renderList();
  }

  /* ── 编辑 ── */
  function startEdit(id) {
    const item = loadMemos().find(m => m.id === id);
    if (!item) return;
    const card = listEl.querySelector(`[data-id="${id}"]`);
    if (!card) return;
    card.classList.add('editing');

    const cat = CATS[item.cat] || CATS.other;
    card.innerHTML = `
      <input class="memo-edit-title" value="${esc(item.title)}" maxlength="60" />
      <textarea class="memo-edit-body" rows="4">${esc(item.body)}</textarea>
      <div style="display:flex;gap:8px;align-items:center;margin-top:6px;">
        <select class="memo-tag-select" style="font-size:12px;padding:4px 8px;border-radius:8px;">
          ${Object.entries(CATS).map(([k,v])=>`<option value="${k}"${k===item.cat?' selected':''}>${v.icon} ${v.label}</option>`).join('')}
        </select>
        <button class="memo-edit-save">保存</button>
        <button class="memo-act-btn" style="opacity:1;font-size:12px;color:var(--text-muted);" id="cancelEdit_${id}">取消</button>
      </div>`;

    card.querySelector('.memo-edit-save').addEventListener('click', () => {
      const newTitle = card.querySelector('.memo-edit-title').value.trim();
      if (!newTitle) return;
      const newBody  = card.querySelector('.memo-edit-body').value.trim();
      const newCat   = card.querySelector('.memo-tag-select').value;
      const list = loadMemos();
      const idx = list.findIndex(m => m.id === id);
      if (idx !== -1) {
        list[idx].title = newTitle;
        list[idx].body  = newBody;
        list[idx].cat   = newCat;
        list[idx].updatedAt = Date.now();
        saveMemos(list);
      }
      renderList();
    });
    card.querySelector(`#cancelEdit_${id}`).addEventListener('click', renderList);
  }

  /* ── 渲染列表 ── */
  function renderList() {
    let list = loadMemos();
    if (currentCat !== 'all') list = list.filter(m => m.cat === currentCat);

    if (list.length === 0) {
      listEl.innerHTML = `
        <div class="memo-empty">
          <div class="memo-empty-icon">📭</div>
          <div>${currentCat === 'all' ? '还没有备忘，快来记录吧～' : '该分类暂无备忘'}</div>
        </div>`;
      return;
    }

    listEl.innerHTML = list.map(item => {
      const cat = CATS[item.cat] || CATS.other;
      const bodyHtml = item.body
        ? `<div class="memo-item-body md-content">${renderMarkdown(item.body)}</div>`
        : '';
      return `
        <div class="memo-item" data-id="${item.id}">
          <div class="memo-item-head">
            <div class="memo-item-title">${esc(item.title)}</div>
            <span class="memo-item-badge ${cat.badge}">${cat.icon} ${cat.label}</span>
          </div>
          ${bodyHtml}
          <div class="memo-item-footer">
            <span class="memo-item-time">${fmtTime(item.updatedAt || item.createdAt)}</span>
            <div class="memo-item-actions">
              <button class="memo-act-btn edit" title="编辑" data-edit="${item.id}">✏️</button>
              <button class="memo-act-btn del"  title="删除" data-del="${item.id}">🗑️</button>
            </div>
          </div>
        </div>`;
    }).join('');

    /* 绑定编辑/删除按钮 */
    listEl.querySelectorAll('[data-edit]').forEach(btn =>
      btn.addEventListener('click', () => startEdit(btn.dataset.edit)));
    listEl.querySelectorAll('[data-del]').forEach(btn =>
      btn.addEventListener('click', () => {
        const memoId = btn.dataset.del;
        const list = loadMemos();
        const deletedMemo = list.find(m => m.id === memoId);
        if (!deletedMemo) return;
        deleteMemo(memoId);
        showToast('已删除备忘', {
          duration: 5000,
          undoCallback: () => {
            const current = loadMemos();
            current.push(deletedMemo);
            saveMemos(current);
            renderList();
          }
        });
      }));
  }

  /* ── 初始化 ── */
  renderList();
})();
</script>

<!-- ══════════════════════════════════════
     手机键盘弹出时输入框自动滚动修复
══════════════════════════════════════ -->
<script>
(function() {
  'use strict';

  // ── 核心：聚焦时滚动到可视区域 ──
  function scrollInputIntoView(el) {
    if (!el) return;
    setTimeout(function() {
      if (el.scrollIntoView) {
        el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }, 320);
  }

  // ── 监听所有 input / textarea / select 的聚焦事件 ──
  document.addEventListener('focusin', function(e) {
    var tag = e.target.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') {
      scrollInputIntoView(e.target);
    }
  }, true);

  // ── visualViewport API：键盘弹出/收起时精确修正滚动 ──
  if (window.visualViewport) {
    var ticking = false;
    function onViewportChange() {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(function() {
        ticking = false;
        var focused = document.activeElement;
        if (!focused) return;
        var tag = focused.tagName;
        if (tag !== 'INPUT' && tag !== 'TEXTAREA' && tag !== 'SELECT') return;

        var vvp = window.visualViewport;
        var rect = focused.getBoundingClientRect();
        var inputBottom = rect.bottom;
        var viewportBottom = vvp.offsetTop + vvp.height;

        if (inputBottom > viewportBottom - 8) {
          var scrollY = window.scrollY || window.pageYOffset;
          var diff = inputBottom - viewportBottom + 12;
          window.scrollTo({ top: scrollY + diff, behavior: 'smooth' });
        }
      });
    }

    window.visualViewport.addEventListener('resize', onViewportChange);
    window.visualViewport.addEventListener('scroll', onViewportChange);
  }
})();
</script>
