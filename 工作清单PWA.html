<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#c8a0f0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="任务清单">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>任务清单</title>
<style>
/* ─── CSS Variables ─── */
:root {
  --bg-gradient: linear-gradient(135deg, #fde8f5 0%, #e8f0ff 50%, #e8fdf5 100%);
  --card-bg: rgba(255,255,255,0.65);
  --card-blur: blur(25px) saturate(180%);
  --card-border: rgba(255,255,255,0.85);
  --card-glass-top: rgba(255,255,255,0.4);
  --card-shadow: 0 8px 32px rgba(180,140,220,0.13), 0 2px 8px rgba(180,140,220,0.08);
  --card-shadow-hover: 0 20px 56px rgba(180,140,220,0.25), 0 6px 20px rgba(180,140,220,0.15);
  --text-primary: #3d2f5e;
  --text-secondary: #7b6fa0;
  --text-muted: #b0a5c8;
  --input-bg: rgba(255,255,255,0.78);
  --input-border: rgba(200,180,240,0.35);
  --filter-bg: rgba(255,255,255,0.45);
  --filter-active-bg: rgba(255,255,255,0.92);
  --filter-active-color: #8b5ecf;
  --filter-text: #8a78b0;
  --note-bg: rgba(248,244,255,0.8);
  --note-border: #d4b8f0;
  --empty-color: rgba(120,100,160,0.45);
  --delete-hover-bg: #ffeef8;
  --delete-hover-color: #e07aaa;
  --toggle-bg: rgba(255,255,255,0.28);
  --toggle-knob: #fff;
  --weather-bg: rgba(255,255,255,0.55);
  --weather-text: #5a4a7e;
  --scrollbar-thumb: rgba(180,140,220,0.3);
}

[data-theme="dark"] {
  --card-bg: rgba(32,24,52,0.68);
  --card-border: rgba(255,255,255,0.06);
  --card-glass-top: rgba(200,180,255,0.08);
  --card-shadow: 0 8px 32px rgba(0,0,0,0.45), 0 2px 8px rgba(0,0,0,0.28);
  --card-shadow-hover: 0 20px 56px rgba(0,0,0,0.6), 0 6px 20px rgba(0,0,0,0.35);
  --text-primary: #ede4ff;
  --text-secondary: #b8a8d8;
  --text-muted: #7a6ea0;
  --input-bg: rgba(42,34,66,0.75);
  --input-border: rgba(130,100,200,0.28);
  --filter-bg: rgba(42,34,66,0.45);
  --filter-active-bg: rgba(140,100,220,0.32);
  --filter-active-color: #d4a8ff;
  --filter-text: #9080b8;
  --note-bg: rgba(36,28,58,0.65);
  --note-border: #7a52c0;
  --empty-color: rgba(150,130,200,0.4);
  --delete-hover-bg: rgba(80,30,50,0.5);
  --delete-hover-color: #f08ab8;
  --toggle-bg: rgba(70,50,110,0.38);
  --toggle-knob: #d4a8ff;
  --weather-bg: rgba(36,28,58,0.55);
  --weather-text: #c0b0e0;
  --scrollbar-thumb: rgba(130,100,200,0.3);
}

/* ══════════════════════════════════════
   Animated Mesh Gradient Background
══════════════════════════════════════ */
body {
  overflow-x: hidden;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: -1;
  background:
    radial-gradient(ellipse 80% 60% at 15% 20%, rgba(220,180,255,0.45) 0%, transparent 70%),
    radial-gradient(ellipse 70% 50% at 85% 30%, rgba(160,200,255,0.4) 0%, transparent 70%),
    radial-gradient(ellipse 60% 55% at 50% 80%, rgba(180,255,220,0.35) 0%, transparent 70%),
    radial-gradient(ellipse 50% 40% at 75% 75%, rgba(255,200,220,0.3) 0%, transparent 70%);
  animation: meshFloat 24s ease-in-out infinite alternate;
  will-change: transform;
}
[data-theme="dark"] body::before {
  background:
    radial-gradient(ellipse 80% 60% at 15% 20%, rgba(100,50,180,0.22) 0%, transparent 70%),
    radial-gradient(ellipse 70% 50% at 85% 30%, rgba(40,60,160,0.18) 0%, transparent 70%),
    radial-gradient(ellipse 60% 55% at 50% 80%, rgba(30,120,100,0.15) 0%, transparent 70%),
    radial-gradient(ellipse 50% 40% at 75% 75%, rgba(160,50,100,0.12) 0%, transparent 70%);
}
@keyframes meshFloat {
  0%   { transform: scale(1)   translate(0, 0); }
  33%  { transform: scale(1.06) translate(12px, -18px); }
  66%  { transform: scale(0.96) translate(-10px, 14px); }
  100% { transform: scale(1.03) translate(6px, -8px); }
}

/* ─── Reset & Base ─── */
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: #f5f0ff;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 48px 20px 80px;
  transition: background 0.4s ease;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  letter-spacing: 0.3px;
}
[data-theme="dark"] body { background: #0e0a18; }

/* ─── App Container ─── */
.app {
  width: 100%;
  max-width: 580px;
  position: relative;
}

/* ─── Top Bar (weather + theme) ─── */
.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
  gap: 12px;
}

/* Weather widget */
.weather-widget {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 16px;
  background: var(--weather-bg);
  backdrop-filter: var(--card-blur);
  -webkit-backdrop-filter: var(--card-blur);
  border-radius: 50px;
  border: 1.5px solid var(--card-border);
  box-shadow: var(--card-shadow);
  color: var(--weather-text);
  font-size: 13px;
  transition: all 0.3s ease;
  flex: 1;
  min-width: 0;
}
.weather-icon { font-size: 22px; flex-shrink: 0; }
.weather-info { display: flex; flex-direction: column; min-width: 0; }
.weather-temp { font-size: 18px; font-weight: 700; color: var(--text-primary); line-height: 1; }
.weather-desc { font-size: 12px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.weather-location { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
.weather-loading { color: var(--text-muted); font-size: 13px; font-style: italic; }

/* Theme toggle button */
.theme-toggle {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: 1.5px solid var(--card-border);
  background: var(--card-bg);
  backdrop-filter: var(--card-blur);
  -webkit-backdrop-filter: var(--card-blur);
  box-shadow: var(--card-shadow);
  cursor: pointer;
  font-size: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s ease;
  flex-shrink: 0;
}
.theme-toggle:hover {
  transform: rotate(20deg) scale(1.08);
  box-shadow: var(--card-shadow-hover);
}
.theme-toggle:active { transform: scale(0.93); }

/* ─── Header ─── */
.header {
  text-align: center;
  margin-bottom: 28px;
}
.header-card {
  background: var(--card-bg);
  backdrop-filter: var(--card-blur);
  -webkit-backdrop-filter: var(--card-blur);
  border: 1.5px solid var(--card-border);
  border-top-color: var(--card-glass-top);
  border-radius: 28px;
  box-shadow: var(--card-shadow);
  padding: 24px 28px 20px;
  transition: all 0.3s ease;
  position: relative;
}
.header-card::before {
  content: '';
  position: absolute;
  top: 0; left: 20px; right: 20px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--card-glass-top), transparent);
  pointer-events: none;
}
.header h1 {
  font-size: 28px;
  font-weight: 900;
  color: var(--text-primary);
  letter-spacing: 1.5px;
}
.header-sub {
  margin-top: 5px;
  font-size: 13px;
  color: var(--text-secondary);
  letter-spacing: 0.8px;
}
.stats {
  margin-top: 16px;
  display: flex;
  justify-content: center;
  gap: 10px;
}
.stat-pill {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  border-radius: 50px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
  background: rgba(180,140,220,0.08);
  transition: all 0.2s;
  letter-spacing: 0.4px;
}
.stat-pill b { font-size: 14px; font-weight: 800; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.dot-all    { background: linear-gradient(135deg,#c8a0f0,#a0c8f0); }
.dot-pending{ background: linear-gradient(135deg,#f9c784,#f7a5a5); }
.dot-done   { background: linear-gradient(135deg,#a0f0c8,#a0e0f0); }

/* ─── Jelly Card Mixin ─── */
.jelly-card {
  background: var(--card-bg);
  backdrop-filter: var(--card-blur);
  -webkit-backdrop-filter: var(--card-blur);
  border: 1.5px solid var(--card-border);
  border-top-color: var(--card-glass-top);
  border-radius: 22px;
  box-shadow: var(--card-shadow);
  transition: box-shadow 0.25s ease, transform 0.18s ease, background 0.3s ease;
  position: relative;
}
.jelly-card::before {
  content: '';
  position: absolute;
  top: 0; left: 12px; right: 12px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--card-glass-top), transparent);
  pointer-events: none;
  border-radius: 1px;
}
.jelly-card:hover {
  box-shadow: var(--card-shadow-hover);
}

/* ─── Input Area ─── */
.input-area { margin-bottom: 18px; }

.toggle-note-input {
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 12px;
  cursor: pointer;
  padding: 3px 0;
  margin-bottom: 8px;
  display: block;
  transition: color 0.2s;
  font-family: inherit;
}
.toggle-note-input:hover { color: var(--text-secondary); }

.note-input-wrap {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.35s cubic-bezier(0.4,0,0.2,1), margin 0.3s;
  margin-bottom: 0;
}
.note-input-wrap.open { max-height: 130px; margin-bottom: 10px; }

.note-input-bar textarea {
  width: 100%;
  padding: 12px 16px;
  border: 1.5px solid var(--input-border);
  border-radius: 16px;
  font-size: 13px;
  background: var(--input-bg);
  backdrop-filter: var(--card-blur);
  -webkit-backdrop-filter: var(--card-blur);
  box-shadow: 0 4px 16px rgba(180,140,220,0.08);
  outline: none;
  resize: none;
  font-family: inherit;
  color: var(--text-primary);
  line-height: 1.5;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.note-input-bar textarea:focus {
  border-color: #c8a0f0;
  box-shadow: 0 0 0 3px rgba(180,140,220,0.15), 0 4px 16px rgba(180,140,220,0.12);
}
.note-input-bar textarea::placeholder { color: var(--text-muted); }

.input-bar { display: flex; gap: 10px; align-items: stretch; }

.input-bar input {
  flex: 1;
  padding: 14px 18px;
  border: 1.5px solid var(--input-border);
  border-radius: 16px;
  font-size: 15px;
  background: var(--input-bg);
  backdrop-filter: var(--card-blur);
  -webkit-backdrop-filter: var(--card-blur);
  box-shadow: 0 4px 20px rgba(180,140,220,0.08);
  outline: none;
  color: var(--text-primary);
  font-family: inherit;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.input-bar input:focus {
  border-color: #c8a0f0;
  box-shadow: 0 0 0 3px rgba(180,140,220,0.15), 0 4px 20px rgba(180,140,220,0.12);
}
.input-bar input::placeholder { color: var(--text-muted); }

.priority-select { position: relative; }
.priority-select select {
  appearance: none;
  -webkit-appearance: none;
  padding: 0 32px 0 14px;
  height: 100%;
  border: 1.5px solid var(--input-border);
  border-radius: 16px;
  font-size: 13px;
  background: var(--input-bg);
  backdrop-filter: var(--card-blur);
  -webkit-backdrop-filter: var(--card-blur);
  box-shadow: 0 4px 16px rgba(180,140,220,0.08);
  outline: none;
  cursor: pointer;
  color: var(--text-primary);
  font-weight: 600;
  font-family: inherit;
  transition: border-color 0.2s;
}
.priority-select select:focus { border-color: #c8a0f0; }
.priority-select::after {
  content: "▾";
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  pointer-events: none;
  color: var(--text-muted);
  font-size: 11px;
}

/* ─── Add Button — Jelly 3D ─── */
.add-btn {
  width: 52px;
  height: 52px;
  border: none;
  border-radius: 16px;
  background: linear-gradient(145deg, #e0b0ff, #b8a0f8);
  color: #fff;
  font-size: 26px;
  font-weight: 300;
  cursor: pointer;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow:
    0 6px 20px rgba(160,120,240,0.38),
    0 2px 6px rgba(160,120,240,0.2),
    inset 0 1px 0 rgba(255,255,255,0.4),
    inset 0 -2px 0 rgba(120,80,200,0.25);
  transition: all 0.18s cubic-bezier(0.34,1.56,0.64,1);
  line-height: 1;
}
.add-btn:hover {
  transform: translateY(-3px) scale(1.06);
  box-shadow:
    0 12px 30px rgba(160,120,240,0.48),
    0 4px 10px rgba(160,120,240,0.28),
    inset 0 1px 0 rgba(255,255,255,0.45),
    inset 0 -2px 0 rgba(120,80,200,0.3);
}
.add-btn:active {
  transform: translateY(1px) scale(0.96);
  box-shadow:
    0 2px 10px rgba(160,120,240,0.28),
    inset 0 2px 4px rgba(120,80,200,0.2);
}

/* ─── Filter Tabs ─── */
.filters {
  display: flex;
  gap: 8px;
  margin-bottom: 18px;
  padding: 6px;
  background: var(--filter-bg);
  backdrop-filter: var(--card-blur);
  -webkit-backdrop-filter: var(--card-blur);
  border-radius: 18px;
  border: 1.5px solid var(--card-border);
  border-top-color: var(--card-glass-top);
  box-shadow: 0 2px 12px rgba(180,140,220,0.08);
}
.filter-btn {
  flex: 1;
  padding: 9px 0;
  border: none;
  border-radius: 12px;
  background: transparent;
  color: var(--filter-text);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.22s ease;
  font-family: inherit;
  letter-spacing: 0.6px;
}
.filter-btn:hover { color: var(--text-primary); }
.filter-btn.active {
  background: var(--filter-active-bg);
  color: var(--filter-active-color);
  box-shadow:
    0 4px 14px rgba(160,120,240,0.2),
    inset 0 1px 0 rgba(255,255,255,0.6);
}

/* ─── Task List ─── */
.task-list { display: flex; flex-direction: column; gap: 10px; }

/* ─── Global Search ─── */
.global-search {
  margin-bottom: 14px;
  position: relative;
}
.global-search input {
  width: 100%;
  padding: 12px 18px 12px 42px;
  border: 1.5px solid var(--input-border);
  border-radius: 16px;
  font-size: 14px;
  background: var(--input-bg);
  backdrop-filter: var(--card-blur);
  -webkit-backdrop-filter: var(--card-blur);
  box-shadow: 0 4px 16px rgba(180,140,220,0.08);
  outline: none;
  color: var(--text-primary);
  font-family: inherit;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.global-search input:focus {
  border-color: #c8a0f0;
  box-shadow: 0 0 0 3px rgba(180,140,220,0.15), 0 4px 16px rgba(180,140,220,0.12);
}
.global-search input::placeholder { color: var(--text-muted); }
.global-search .search-icon {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 16px;
  color: var(--text-muted);
  pointer-events: none;
  transition: color 0.2s;
}
.global-search input:focus ~ .search-icon { color: #c8a0f0; }
.global-search .search-clear {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  font-size: 16px;
  color: var(--text-muted);
  cursor: pointer;
  padding: 4px 6px;
  border-radius: 6px;
  display: none;
  transition: color 0.15s;
}
.global-search .search-clear:hover { color: var(--text-primary); }
.global-search .search-clear.visible { display: block; }

/* Search dimming effect */
.task-item.search-dimmed {
  filter: grayscale(1) opacity(0.3);
  pointer-events: none;
  transform: none !important;
}
.task-item.search-dimmed:hover {
  box-shadow: var(--card-shadow);
}
.task-item.search-highlight {
  box-shadow: var(--card-shadow-hover);
  transform: translateY(-2px) scale(1.01);
}

/* ─── Markdown Rendered Content ─── */
.md-content { line-height: 1.7; word-break: break-word; }
.md-content p { margin-bottom: 6px; }
.md-content p:last-child { margin-bottom: 0; }
.md-content strong { font-weight: 700; color: var(--text-primary); }
.md-content em { font-style: italic; }
.md-content code {
  background: rgba(180,140,220,0.1);
  padding: 1px 6px;
  border-radius: 5px;
  font-size: 0.9em;
  font-family: "Cascadia Code", "Fira Code", Consolas, monospace;
  color: var(--filter-active-color);
}
.md-content pre {
  background: rgba(0,0,0,0.06);
  border-radius: 10px;
  padding: 10px 14px;
  overflow-x: auto;
  margin: 8px 0;
  font-size: 0.88em;
  line-height: 1.5;
}
[data-theme="dark"] .md-content pre { background: rgba(255,255,255,0.06); }
.md-content pre code {
  background: none;
  padding: 0;
  border-radius: 0;
  color: inherit;
  font-size: inherit;
}
.md-content ul, .md-content ol {
  margin: 6px 0;
  padding-left: 22px;
}
.md-content li { margin-bottom: 2px; }
.md-content blockquote {
  border-left: 3px solid var(--filter-active-color);
  padding: 4px 12px;
  margin: 8px 0;
  color: var(--text-secondary);
  background: rgba(180,140,220,0.05);
  border-radius: 0 8px 8px 0;
}
.md-content hr {
  border: none;
  border-top: 1px solid var(--input-border);
  margin: 10px 0;
}
.md-content a {
  color: var(--filter-active-color);
  text-decoration: underline;
  text-underline-offset: 2px;
}
.md-content h1, .md-content h2, .md-content h3 {
  color: var(--text-primary);
  font-weight: 700;
  margin: 10px 0 4px;
}
.md-content h1 { font-size: 1.15em; }
.md-content h2 { font-size: 1.08em; }
.md-content h3 { font-size: 1em; }
[data-theme="dark"] .md-content a { color: #d4a8ff; }
[data-theme="dark"] .md-content code { background: rgba(255,255,255,0.08); }

/* ─── Task Item — Jelly 3D ─── */
.task-item {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  padding: 16px 18px;
  background: var(--card-bg);
  backdrop-filter: var(--card-blur);
  -webkit-backdrop-filter: var(--card-blur);
  border: 1.5px solid var(--card-border);
  border-top-color: var(--card-glass-top);
  border-radius: 22px;
  box-shadow: var(--card-shadow);
  transition: box-shadow 0.25s ease, transform 0.22s cubic-bezier(0.34,1.56,0.64,1), background 0.3s, z-index 0s 0.3s;
  animation: jellyIn 0.38s cubic-bezier(0.34,1.56,0.64,1);
  cursor: default;
  position: relative;
  overflow: visible;
  z-index: 1;
}
.task-item.dropdown-open {
  z-index: 500;
  box-shadow: var(--card-shadow-hover);
  transition: box-shadow 0.15s ease, transform 0.15s ease, background 0.3s, z-index 0s;
}
.task-item::before {
  content: '';
  position: absolute;
  top: 0; left: 12px; right: 12px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--card-glass-top), transparent);
  pointer-events: none;
  z-index: 1;
}
.task-item:hover {
  box-shadow: var(--card-shadow-hover);
  transform: translateY(-5px) scale(1.02);
}
.task-item.removing { animation: jellyOut 0.32s ease forwards; }

/* Priority left accent — replaced by breathing glow ::after */

@keyframes jellyIn {
  0%   { opacity: 0; transform: translateY(-14px) scale(0.92); }
  60%  { transform: translateY(4px) scale(1.01); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes jellyOut {
  0%   { opacity: 1; transform: translateX(0) scale(1); }
  100% { opacity: 0; transform: translateX(60px) scale(0.9); }
}

/* ─── Checkbox — Jelly 3D + Ripple ─── */
.checkbox {
  width: 26px; height: 26px;
  border-radius: 50%;
  border: 2.5px solid var(--text-muted);
  cursor: pointer;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.22s cubic-bezier(0.34,1.56,0.64,1);
  margin-top: 1px;
  box-shadow: inset 0 2px 4px rgba(0,0,0,0.04);
  position: relative;
  overflow: visible;
}
.checkbox:hover {
  border-color: #c8a0f0;
  transform: scale(1.12);
  box-shadow: 0 0 0 4px rgba(180,140,220,0.14);
}
.checkbox.checked {
  background: linear-gradient(135deg, #a0f0c8, #70d8f0);
  border-color: transparent;
  box-shadow:
    0 4px 14px rgba(80,200,160,0.4),
    inset 0 1px 0 rgba(255,255,255,0.5);
  transform: scale(1.08);
}
.checkbox.checked::after {
  content: "✓";
  color: #fff;
  font-size: 14px;
  font-weight: 800;
  text-shadow: 0 1px 2px rgba(0,0,0,0.15);
  position: relative;
  z-index: 1;
}
/* 复选框波纹 */
.checkbox .ripple {
  position: absolute;
  top: 50%; left: 50%;
  width: 10px; height: 10px;
  border-radius: 50%;
  background: rgba(100,220,180,0.35);
  transform: translate(-50%,-50%) scale(0);
  animation: checkboxRipple 0.5s ease-out forwards;
  pointer-events: none;
}
@keyframes checkboxRipple {
  0%   { transform: translate(-50%,-50%) scale(1); opacity: 1; }
  100% { transform: translate(-50%,-50%) scale(5); opacity: 0; }
}

/* ─── Task Content ─── */
.task-content { flex: 1; min-width: 0; }
.task-main {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  user-select: none;
}
.task-text {
  flex: 1;
  font-size: 15px;
  color: var(--text-primary);
  word-break: break-word;
  transition: all 0.22s;
  line-height: 1.5;
  letter-spacing: 0.2px;
  user-select: text;
  -webkit-user-select: text;
}
.task-text.done {
  text-decoration: line-through;
  color: var(--text-muted);
}
.note-indicator {
  font-size: 13px;
  opacity: 0.4;
  flex-shrink: 0;
  transition: opacity 0.2s, transform 0.2s;
}
.task-main:hover .note-indicator { opacity: 0.75; transform: rotate(-8deg); }

/* ─── Note Panel ─── */
.task-note {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.35s cubic-bezier(0.4,0,0.2,1), padding 0.3s, opacity 0.3s;
  opacity: 0;
}
.task-note.open { max-height: 320px; padding-top: 12px; opacity: 1; }

.task-note-display {
  background: var(--note-bg);
  border-radius: 12px;
  padding: 10px 14px;
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.7;
  white-space: pre-wrap;
  word-break: break-word;
  border-left: 3px solid var(--note-border);
}
.task-note-empty-hint {
  font-size: 12px;
  color: var(--text-muted);
  font-style: italic;
}

.task-note-edit textarea {
  width: 100%;
  padding: 10px 14px;
  border: 1.5px solid var(--note-border);
  border-radius: 12px;
  font-size: 13px;
  font-family: inherit;
  color: var(--text-primary);
  background: var(--note-bg);
  line-height: 1.6;
  resize: none;
  outline: none;
  min-height: 68px;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.task-note-edit textarea:focus {
  border-color: #c8a0f0;
  box-shadow: 0 0 0 3px rgba(180,140,220,0.13);
}

.note-edit-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 8px;
}

/* Note action buttons */
.note-save-btn, .note-ghost-btn {
  padding: 6px 16px;
  border: none;
  border-radius: 10px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.18s cubic-bezier(0.34,1.4,0.64,1);
}
.note-save-btn {
  background: linear-gradient(135deg, #c8a0f0, #a090e8);
  color: #fff;
  box-shadow: 0 3px 10px rgba(160,120,240,0.32), inset 0 1px 0 rgba(255,255,255,0.3);
}
.note-save-btn:hover { transform: translateY(-1px) scale(1.04); box-shadow: 0 5px 16px rgba(160,120,240,0.42); }
.note-save-btn:active { transform: scale(0.96); }
.note-ghost-btn {
  background: rgba(180,140,220,0.1);
  color: var(--text-secondary);
  border: 1px solid rgba(180,140,220,0.2);
}
.note-ghost-btn:hover { background: rgba(180,140,220,0.18); color: var(--text-primary); }

/* ─── Priority Tags — Candy Bubbles ─── */
.priority-tag {
  font-size: 11px;
  padding: 3px 11px;
  border-radius: 50px;
  font-weight: 700;
  flex-shrink: 0;
  margin-top: 2px;
  letter-spacing: 0.5px;
  position: relative;
  overflow: hidden;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  transition: transform 0.2s cubic-bezier(0.34,1.56,0.64,1);
}
/* 糖果高光 */
.priority-tag::before {
  content: '';
  position: absolute;
  top: 0; left: 8px; right: 8px;
  height: 1px;
  background: rgba(255,255,255,0.65);
  border-radius: 1px;
}
.priority-tag::after {
  content: '';
  position: absolute;
  top: 1px; left: 20%;
  width: 60%; height: 45%;
  background: radial-gradient(ellipse, rgba(255,255,255,0.35) 0%, transparent 70%);
  border-radius: 50%;
  pointer-events: none;
}
.priority-tag:hover { transform: scale(1.1); }

.priority-high   {
  background: linear-gradient(145deg, rgba(255,180,200,0.82), rgba(255,140,170,0.72));
  color: #a03058;
  box-shadow: 0 2px 10px rgba(255,120,160,0.4), inset 0 1px 0 rgba(255,255,255,0.55);
}
.priority-medium {
  background: linear-gradient(145deg, rgba(255,225,140,0.82), rgba(255,200,90,0.72));
  color: #8a6010;
  box-shadow: 0 2px 10px rgba(255,190,70,0.4), inset 0 1px 0 rgba(255,255,255,0.55);
}
.priority-low {
  background: linear-gradient(145deg, rgba(160,240,200,0.82), rgba(120,225,180,0.72));
  color: #1a6840;
  box-shadow: 0 2px 10px rgba(100,210,160,0.4), inset 0 1px 0 rgba(255,255,255,0.55);
}

/* 暗色模式糖果调优 */
[data-theme="dark"] .priority-high {
  background: linear-gradient(145deg, rgba(255,100,140,0.45), rgba(200,60,100,0.38));
  color: #ffb0c0;
  box-shadow: 0 2px 10px rgba(255,80,120,0.25), inset 0 1px 0 rgba(255,255,255,0.18);
}
[data-theme="dark"] .priority-medium {
  background: linear-gradient(145deg, rgba(255,200,80,0.4), rgba(200,160,40,0.32));
  color: #ffd080;
  box-shadow: 0 2px 10px rgba(255,180,50,0.25), inset 0 1px 0 rgba(255,255,255,0.18);
}
[data-theme="dark"] .priority-low {
  background: linear-gradient(145deg, rgba(80,210,140,0.4), rgba(50,180,110,0.32));
  color: #a0f0c8;
  box-shadow: 0 2px 10px rgba(60,200,130,0.25), inset 0 1px 0 rgba(255,255,255,0.18);
}

/* ─── Priority Breathing Glow (left side) ─── */
.task-item[data-priority="high"]::after,
.task-item[data-priority="medium"]::after,
.task-item[data-priority="low"]::after {
  content: '';
  position: absolute;
  left: -1px;
  top: 20%;
  width: 4px;
  height: 60%;
  border-radius: 0 4px 4px 0;
  pointer-events: none;
  z-index: 2;
  animation: breatheGlow 3s ease-in-out infinite;
}
.task-item[data-priority="high"]::after {
  background: #f7a5c8;
  box-shadow: 0 0 12px rgba(247,165,200,0.5), 0 0 24px rgba(247,165,200,0.2);
}
.task-item[data-priority="medium"]::after {
  background: #f9d18c;
  box-shadow: 0 0 12px rgba(249,209,140,0.5), 0 0 24px rgba(249,209,140,0.2);
  animation-delay: 1s;
}
.task-item[data-priority="low"]::after {
  background: #a0f0c8;
  box-shadow: 0 0 12px rgba(160,240,200,0.5), 0 0 24px rgba(160,240,200,0.2);
  animation-delay: 2s;
}
@keyframes breatheGlow {
  0%, 100% { opacity: 0.5; height: 55%; }
  50%      { opacity: 1;   height: 70%; }
}

/* ─── In-line Priority Selector ─── */
.priority-switch {
  position: relative;
  flex-shrink: 0;
  margin-top: 2px;
}
.priority-switch-btn {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 3px 10px 3px 11px;
  border-radius: 50px;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  border: none;
  letter-spacing: 0.5px;
  transition: transform 0.2s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.2s;
  position: relative;
  overflow: hidden;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
.priority-switch-btn:hover { transform: scale(1.1); }
.priority-switch-btn::before {
  content: '';
  position: absolute;
  top: 0; left: 8px; right: 8px;
  height: 1px;
  background: rgba(255,255,255,0.65);
  border-radius: 1px;
}
.priority-switch-btn::after {
  content: '';
  position: absolute;
  top: 1px; left: 20%;
  width: 60%; height: 45%;
  background: radial-gradient(ellipse, rgba(255,255,255,0.35) 0%, transparent 70%);
  border-radius: 50%;
  pointer-events: none;
}
.priority-switch-btn.ps-high   { background: linear-gradient(145deg, rgba(255,180,200,0.82), rgba(255,140,170,0.72)); color: #a03058; box-shadow: 0 2px 10px rgba(255,120,160,0.4), inset 0 1px 0 rgba(255,255,255,0.55); }
.priority-switch-btn.ps-medium { background: linear-gradient(145deg, rgba(255,225,140,0.82), rgba(255,200,90,0.72));  color: #8a6010; box-shadow: 0 2px 10px rgba(255,190,70,0.4), inset 0 1px 0 rgba(255,255,255,0.55); }
.priority-switch-btn.ps-low    { background: linear-gradient(145deg, rgba(160,240,200,0.82), rgba(120,225,180,0.72)); color: #1a6840; box-shadow: 0 2px 10px rgba(100,210,160,0.4), inset 0 1px 0 rgba(255,255,255,0.55); }
[data-theme="dark"] .priority-switch-btn.ps-high   { background: linear-gradient(145deg, rgba(255,100,140,0.45), rgba(200,60,100,0.38)); color: #ffb0c0; box-shadow: 0 2px 10px rgba(255,80,120,0.25), inset 0 1px 0 rgba(255,255,255,0.18); }
[data-theme="dark"] .priority-switch-btn.ps-medium { background: linear-gradient(145deg, rgba(255,200,80,0.4), rgba(200,160,40,0.32));  color: #ffd080; box-shadow: 0 2px 10px rgba(255,180,50,0.25), inset 0 1px 0 rgba(255,255,255,0.18); }
[data-theme="dark"] .priority-switch-btn.ps-low    { background: linear-gradient(145deg, rgba(80,210,140,0.4), rgba(50,180,110,0.32)); color: #a0f0c8; box-shadow: 0 2px 10px rgba(60,200,130,0.25), inset 0 1px 0 rgba(255,255,255,0.18); }

.priority-switch-btn .ps-arrow {
  font-size: 8px;
  opacity: 0.6;
  margin-left: 1px;
}

/* 下拉面板 */
.priority-dropdown {
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  z-index: 100;
  background: var(--card-bg);
  backdrop-filter: var(--card-blur);
  -webkit-backdrop-filter: var(--card-blur);
  border: 1.5px solid var(--card-border);
  border-top-color: var(--card-glass-top);
  border-radius: 14px;
  box-shadow: 0 12px 36px rgba(100,60,160,0.25), 0 4px 12px rgba(100,60,160,0.12);
  padding: 6px;
  display: none;
  min-width: 88px;
}
.priority-dropdown.show { display: block; animation: dropIn 0.2s ease; }
@keyframes dropIn {
  0%   { opacity: 0; transform: translateY(-6px) scale(0.95); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}
.priority-dropdown button {
  display: flex;
  align-items: center;
  gap: 6px;
  width: 100%;
  padding: 7px 12px;
  border: none;
  border-radius: 10px;
  background: transparent;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
  cursor: pointer;
  transition: background 0.14s, color 0.14s;
  font-family: inherit;
  letter-spacing: 0.3px;
}
.priority-dropdown button:hover { background: rgba(180,140,220,0.12); color: var(--text-primary); }
.priority-dropdown button.current { color: var(--filter-active-color); background: rgba(180,140,220,0.08); }
.priority-dropdown .dd-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.dd-dot-high   { background: linear-gradient(135deg, #f7a5c8, #ffaac0); }
.dd-dot-medium { background: linear-gradient(135deg, #f9d18c, #ffd47a); }
.dd-dot-low    { background: linear-gradient(135deg, #a0f0c8, #88e8c0); }

/* ─── Delete Button ─── */
.delete-btn {
  width: 30px; height: 30px;
  border: none;
  border-radius: 10px;
  background: transparent;
  color: var(--text-muted);
  font-size: 17px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.18s ease;
  margin-top: 0;
}
.delete-btn:hover {
  background: var(--delete-hover-bg);
  color: var(--delete-hover-color);
  transform: scale(1.15) rotate(8deg);
}

/* ─── Empty State ─── */
.empty {
  text-align: center;
  color: var(--empty-color);
  padding: 56px 0 40px;
  font-size: 14px;
}
.empty .icon {
  font-size: 52px;
  margin-bottom: 12px;
  animation: floatIcon 3s ease-in-out infinite;
}
@keyframes floatIcon {
  0%,100% { transform: translateY(0); }
  50%      { transform: translateY(-8px); }
}

/* ─── Scrollbar ─── */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 3px; }

textarea::-webkit-scrollbar { width: 4px; }
textarea::-webkit-scrollbar-thumb { background: rgba(180,140,220,0.25); border-radius: 2px; }

/* ─── Lock Screen ─── */
#lockScreen {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg-gradient);
  transition: opacity 0.45s ease, transform 0.45s ease;
}
#lockScreen.hide {
  opacity: 0;
  transform: scale(1.06);
  pointer-events: none;
}

.lock-card {
  width: 100%;
  max-width: 360px;
  margin: 0 20px;
  background: var(--card-bg);
  backdrop-filter: var(--card-blur);
  -webkit-backdrop-filter: var(--card-blur);
  border: 1.5px solid var(--card-border);
  border-radius: 32px;
  box-shadow: var(--card-shadow-hover);
  padding: 40px 32px 36px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.lock-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), transparent);
}

.lock-icon {
  font-size: 52px;
  margin-bottom: 6px;
  display: block;
  animation: lockBounce 2.4s ease-in-out infinite;
}
@keyframes lockBounce {
  0%,100% { transform: translateY(0) rotate(-3deg); }
  50%      { transform: translateY(-8px) rotate(3deg); }
}

.lock-title {
  font-size: 22px;
  font-weight: 800;
  color: var(--text-primary);
  margin-bottom: 6px;
}
.lock-subtitle {
  font-size: 13px;
  color: var(--text-secondary);
  margin-bottom: 28px;
}

/* PIN dots */
.pin-dots {
  display: flex;
  justify-content: center;
  gap: 14px;
  margin-bottom: 24px;
}
.pin-dot {
  width: 16px; height: 16px;
  border-radius: 50%;
  border: 2.5px solid var(--text-muted);
  background: transparent;
  transition: all 0.22s cubic-bezier(0.34,1.56,0.64,1);
}
.pin-dot.filled {
  background: linear-gradient(135deg, #c8a0f0, #a090e8);
  border-color: transparent;
  box-shadow: 0 3px 10px rgba(160,120,240,0.42);
  transform: scale(1.15);
}
.pin-dot.error {
  background: linear-gradient(135deg, #f7a5c8, #e07aaa);
  border-color: transparent;
  box-shadow: 0 3px 10px rgba(220,100,150,0.4);
}

/* Numpad */
.numpad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}
.num-btn {
  border: none;
  border-radius: 18px;
  background: var(--input-bg);
  color: var(--text-primary);
  font-size: 20px;
  font-weight: 700;
  font-family: inherit;
  height: 60px;
  cursor: pointer;
  border: 1.5px solid var(--input-border);
  box-shadow:
    0 4px 12px rgba(180,140,220,0.1),
    inset 0 1px 0 rgba(255,255,255,0.5);
  transition: all 0.16s cubic-bezier(0.34,1.56,0.64,1);
  backdrop-filter: var(--card-blur);
  -webkit-backdrop-filter: var(--card-blur);
  position: relative;
  overflow: hidden;
}
.num-btn:hover {
  transform: translateY(-2px) scale(1.04);
  box-shadow:
    0 8px 20px rgba(180,140,220,0.2),
    inset 0 1px 0 rgba(255,255,255,0.6);
  border-color: rgba(200,160,240,0.5);
}
.num-btn:active {
  transform: scale(0.93);
  box-shadow: 0 2px 6px rgba(180,140,220,0.15);
}
.num-btn.del-btn {
  font-size: 22px;
  color: var(--text-secondary);
}
.num-btn.zero-btn { grid-column: 2; }

.lock-error {
  margin-top: 16px;
  font-size: 12px;
  color: #e07aaa;
  min-height: 18px;
  font-weight: 600;
  opacity: 0;
  transition: opacity 0.2s;
}
.lock-error.show { opacity: 1; }

/* 设置密码提示 */
.lock-hint {
  margin-top: 14px;
  font-size: 11px;
  color: var(--text-muted);
}
.lock-hint b { color: var(--text-secondary); }

/* shake animation */
@keyframes shake {
  0%,100% { transform: translateX(0); }
  20%     { transform: translateX(-10px); }
  40%     { transform: translateX(10px); }
  60%     { transform: translateX(-7px); }
  80%     { transform: translateX(7px); }
}
.shake { animation: shake 0.38s ease; }

/* ── Lock screen weather strip ── */
.lock-weather-strip {
  margin-top: 0;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 8px 16px;
  border-radius: 14px;
  background: var(--weather-bg);
  border: 1px solid var(--card-border);
  font-size: 13px;
  color: var(--weather-text);
  min-height: 34px;
}

/* ── lock action links ── */
.lock-actions {
  margin-top: 14px;
  display: flex;
  justify-content: center;
  gap: 18px;
}
.lock-link {
  background: none;
  border: none;
  font-size: 12px;
  color: var(--text-secondary);
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 8px;
  font-family: inherit;
  transition: all 0.18s;
  text-decoration: underline;
  text-underline-offset: 3px;
}
.lock-link:hover { color: var(--text-primary); background: rgba(180,140,220,0.1); }

/* ── Security question panel (inside lock card) ── */
.sq-panel {
  display: none;
  text-align: left;
}
.sq-panel.show { display: block; }
.sq-select, .sq-input {
  width: 100%;
  box-sizing: border-box;
  background: var(--input-bg);
  border: 1.5px solid var(--input-border);
  border-radius: 14px;
  color: var(--text-primary);
  font-size: 13px;
  font-family: inherit;
  padding: 10px 14px;
  margin-bottom: 10px;
  outline: none;
  transition: border-color 0.2s;
}
.sq-select:focus, .sq-input:focus { border-color: rgba(200,160,240,0.7); }
.sq-select option { background: var(--input-bg); }
.sq-btn-row {
  display: flex;
  gap: 10px;
  margin-top: 4px;
}
.sq-btn {
  flex: 1;
  border: none;
  border-radius: 14px;
  padding: 11px;
  font-size: 13px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.18s cubic-bezier(0.34,1.56,0.64,1);
}
.sq-btn.primary {
  background: linear-gradient(135deg, #c8a0f0, #a090e8);
  color: #fff;
  box-shadow: 0 4px 12px rgba(160,120,240,0.35);
}
.sq-btn.primary:hover { transform: translateY(-1px) scale(1.02); box-shadow: 0 6px 18px rgba(160,120,240,0.45); }
.sq-btn.ghost {
  background: var(--input-bg);
  border: 1.5px solid var(--input-border);
  color: var(--text-secondary);
}
.sq-btn.ghost:hover { background: rgba(180,140,220,0.1); color: var(--text-primary); }

/* ── Change-password panel (modal overlay inside app) ── */
#changePinOverlay {
  position: fixed;
  inset: 0;
  z-index: 8000;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,0.35);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}
#changePinOverlay.show { display: flex; }
.change-pin-card {
  width: 100%;
  max-width: 340px;
  margin: 0 20px;
  background: var(--card-bg);
  backdrop-filter: var(--card-blur);

/* ══════════════════════════════════════
   MEMO — 备忘录
══════════════════════════════════════ */

/* 悬浮入口按钮 */
#memoFab {
  position: fixed;
  bottom: 28px;
  right: 24px;
  z-index: 6000;
  width: 52px;
  height: 52px;
  border-radius: 50%;
  border: none;
  background: linear-gradient(135deg,#c084fc,#818cf8);
  color: #fff;
  font-size: 22px;
  cursor: pointer;
  box-shadow: 0 6px 24px rgba(180,140,220,0.45);
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.22s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.2s;
}
#memoFab:hover { transform: scale(1.12); box-shadow: 0 10px 32px rgba(180,140,220,0.6); }

/* 抽屉遮罩 */
#memoMask {
  position: fixed; inset: 0; z-index: 6500;
  background: rgba(0,0,0,0.32);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  opacity: 0; pointer-events: none;
  transition: opacity 0.28s;
}
#memoMask.open { opacity: 1; pointer-events: all; }

/* 抽屉主体（右侧滑入） */
#memoDrawer {
  position: fixed;
  top: 0; right: 0; bottom: 0;
  z-index: 7000;
  width: min(420px, 96vw);
  background: var(--card-bg);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border-left: 1.5px solid var(--card-border);
  box-shadow: -8px 0 40px rgba(0,0,0,0.18);
  display: flex; flex-direction: column;
  transform: translateX(110%);
  transition: transform 0.32s cubic-bezier(0.32,0.72,0,1);
}
#memoDrawer.open { transform: translateX(0); }

/* 抽屉头部 */
.memo-header {
  display: flex; align-items: center; gap: 10px;
  padding: 20px 20px 14px;
  border-bottom: 1px solid var(--input-border);
  flex-shrink: 0;
}
.memo-header h2 {
  flex: 1;
  font-size: 17px; font-weight: 800;
  color: var(--text-primary);
  margin: 0;
}
.memo-close {
  width: 100%; height: 48px;
  border: none; border-radius: 14px;
  background: linear-gradient(135deg, #c8a0f0, #a090e8);
  color: #fff;
  font-size: 15px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  gap: 6px;
  transition: all 0.15s;
  cursor: pointer;
  font-family: inherit;
  letter-spacing: 0.5px;
  box-shadow: 0 4px 16px rgba(160,120,232,0.25);
}
.memo-close:hover { filter: brightness(1.08); transform: translateY(-1px); }
.memo-close:active { transform: translateY(0); }

/* 备忘列表可滚动 */
.memo-list {
  flex: 1;
  overflow-y: auto;
  padding: 0 16px;
  -webkit-overflow-scrolling: touch;
}

/* 分类标签栏 */
.memo-tags {
  display: flex; gap: 6px; flex-wrap: wrap;
  padding: 10px 16px 8px;
  border-bottom: 1px solid var(--input-border);
  flex-shrink: 0;
}
.memo-tag {
  padding: 4px 12px;
  border-radius: 20px;
  border: 1.5px solid var(--input-border);
  background: var(--filter-bg);
  color: var(--filter-text);
  font-size: 12px; font-weight: 600;
  cursor: pointer;
  transition: all 0.16s;
}
.memo-tag.active {
  background: linear-gradient(135deg,rgba(192,132,252,0.25),rgba(129,140,248,0.25));
  border-color: #c084fc;
  color: var(--filter-active-color);
}

/* 输入区 */
.memo-input-area {
  padding: 12px 16px 10px;
  border-bottom: 1px solid var(--input-border);
  flex-shrink: 0;
  display: flex; flex-direction: column; gap: 8px;
}
.memo-input-row {
  display: flex; gap: 8px; align-items: flex-end;
}
.memo-title-input {
  flex: 1;
  padding: 9px 13px;
  border-radius: 12px;
  border: 1.5px solid var(--input-border);
  background: var(--input-bg);
  color: var(--text-primary);
  font-size: 14px; font-weight: 600;
  outline: none;
  transition: border-color 0.18s;
}
.memo-title-input:focus { border-color: #c084fc; }
.memo-title-input::placeholder { color: var(--text-muted); font-weight: 400; }

.memo-body-input {
  width: 100%;
  padding: 9px 13px;
  border-radius: 12px;
  border: 1.5px solid var(--input-border);
  background: var(--input-bg);
  color: var(--text-primary);
  font-size: 13px;
  resize: none; outline: none;
  min-height: 68px;
  font-family: inherit;
  line-height: 1.6;
  transition: border-color 0.18s;
  box-sizing: border-box;
}
.memo-body-input:focus { border-color: #c084fc; }
.memo-body-input::placeholder { color: var(--text-muted); }

.memo-tag-select {
  padding: 7px 10px;
  border-radius: 12px;
  border: 1.5px solid var(--input-border);
  background: var(--input-bg);
  color: var(--text-primary);
  font-size: 13px; cursor: pointer;
  outline: none;
}
.memo-add-btn {
  padding: 9px 18px;
  border: none; border-radius: 12px;
  background: linear-gradient(135deg,#c084fc,#818cf8);
  color: #fff; font-size: 14px; font-weight: 700;
  cursor: pointer; white-space: nowrap;
  transition: all 0.18s;
}
.memo-add-btn:hover { filter: brightness(1.1); transform: translateY(-1px); }

/* 备忘列表 */
.memo-list {
  flex: 1; overflow-y: auto;
  padding: 10px 14px 24px;
}
.memo-list::-webkit-scrollbar { width: 5px; }
.memo-list::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 4px; }

/* 空态 */
.memo-empty {
  text-align: center;
  padding: 48px 20px;
  color: var(--empty-color);
  font-size: 14px;
}
.memo-empty-icon { font-size: 42px; margin-bottom: 10px; }

/* 单条备忘卡片 */
.memo-item {
  background: var(--input-bg);
  border: 1.5px solid var(--input-border);
  border-radius: 16px;
  padding: 13px 14px 11px;
  margin-bottom: 10px;
  position: relative;
  transition: box-shadow 0.18s, transform 0.18s;
  cursor: default;
}
.memo-item:hover {
  box-shadow: 0 4px 18px rgba(180,140,220,0.18);
  transform: translateY(-1px);
}
.memo-item-head {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 5px;
}
.memo-item-title {
  flex: 1; font-size: 14px; font-weight: 700;
  color: var(--text-primary);
  word-break: break-all;
}
.memo-item-badge {
  font-size: 10px; font-weight: 700;
  padding: 2px 8px; border-radius: 10px;
  white-space: nowrap;
}
.badge-work   { background: rgba(129,140,248,0.2); color: #818cf8; }
.badge-life   { background: rgba(52,211,153,0.2);  color: #059669; }
.badge-idea   { background: rgba(251,191,36,0.2);  color: #d97706; }
.badge-data   { background: rgba(244,114,182,0.2); color: #db2777; }
.badge-other  { background: rgba(156,163,175,0.2); color: #6b7280; }
.memo-item-body {
  font-size: 13px; color: var(--text-secondary);
  line-height: 1.65; white-space: pre-wrap; word-break: break-all;
}
.memo-item-footer {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: 8px;
}
.memo-item-time {
  font-size: 11px; color: var(--text-muted);
}
.memo-item-actions {
  display: flex; gap: 4px; opacity: 0;
  transition: opacity 0.15s;
}
.memo-item:hover .memo-item-actions { opacity: 1; }
.memo-act-btn {
  width: 26px; height: 26px;
  border: none; border-radius: 8px;
  background: transparent;
  cursor: pointer; font-size: 13px;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.14s;
}
.memo-act-btn:hover { background: rgba(180,140,220,0.15); }
.memo-act-btn.del:hover { background: var(--delete-hover-bg); color: var(--delete-hover-color); }

/* 编辑状态 */
.memo-item.editing {
  border-color: #c084fc;
  box-shadow: 0 0 0 3px rgba(192,132,252,0.15);
}
.memo-edit-title {
  width: 100%; padding: 5px 8px; margin-bottom: 6px;
  border-radius: 8px; border: 1.5px solid var(--input-border);
  background: var(--input-bg); color: var(--text-primary);
  font-size: 14px; font-weight: 700; outline: none;
  box-sizing: border-box;
}
.memo-edit-title:focus { border-color: #c084fc; }
.memo-edit-body {
  width: 100%; padding: 5px 8px;
  border-radius: 8px; border: 1.5px solid var(--input-border);
  background: var(--input-bg); color: var(--text-secondary);
  font-size: 13px; resize: vertical; outline: none;
  min-height: 56px; font-family: inherit; line-height: 1.6;
  box-sizing: border-box;
}
.memo-edit-body:focus { border-color: #c084fc; }
.memo-edit-save {
  margin-top: 7px; padding: 5px 14px;
  border: none; border-radius: 9px;
  background: linear-gradient(135deg,#c084fc,#818cf8);
  color: #fff; font-size: 12px; font-weight: 700;
  cursor: pointer; transition: filter 0.15s;
}
.memo-edit-save:hover { filter: brightness(1.1); }

/* ── gear/settings button in top-bar ── */
.settings-btn {
  width: 38px; height: 38px;
  border: none;
  border-radius: 13px;
  background: var(--toggle-bg);
  border: 1.5px solid var(--card-border);
  color: var(--text-secondary);
  font-size: 17px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.18s cubic-bezier(0.34,1.56,0.64,1);
  box-shadow: 0 2px 8px rgba(180,140,220,0.1);
}
.settings-btn:hover { transform: scale(1.08) rotate(20deg); background: rgba(180,140,220,0.18); }

/* ── Settings Dropdown ── */
.settings-dropdown {
  position: absolute;
  top: calc(100% + 8px);
  right: 0;
  z-index: 500;
  min-width: 180px;
  background: var(--card-bg);
  backdrop-filter: var(--card-blur);
  -webkit-backdrop-filter: var(--card-blur);
  border: 1.5px solid var(--card-border);
  border-top-color: var(--card-glass-top);
  border-radius: 16px;
  box-shadow: 0 12px 36px rgba(100,60,160,0.22), 0 4px 12px rgba(100,60,160,0.1);
  padding: 6px;
  display: none;
}
.settings-dropdown.show { display: block; animation: dropIn 0.2s ease; }
.settings-dropdown button {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 10px 14px;
  border: none;
  border-radius: 12px;
  background: transparent;
  color: var(--text-secondary);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.14s;
  font-family: inherit;
  letter-spacing: 0.3px;
}
.settings-dropdown button:hover { background: rgba(180,140,220,0.12); color: var(--text-primary); }
.settings-dropdown button .sd-icon { font-size: 16px; width: 22px; text-align: center; }
.settings-dropdown .sd-divider { height: 1px; background: var(--input-border); margin: 4px 8px; }

/* ── Toast Notification ── */
.toast-container {
  position: fixed;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 9000;
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: center;
  pointer-events: none;
}
.toast {
  padding: 12px 20px;
  border-radius: 14px;
  background: var(--card-bg);
  backdrop-filter: var(--card-blur);
  -webkit-backdrop-filter: var(--card-blur);
  border: 1.5px solid var(--card-border);
  box-shadow: 0 8px 32px rgba(100,60,160,0.22);
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  gap: 10px;
  pointer-events: all;
  animation: toastIn 0.3s cubic-bezier(0.34,1.56,0.64,1);
  white-space: nowrap;
}
.toast.out { animation: toastOut 0.25s ease forwards; }
.toast-undo {
  padding: 4px 12px;
  border: none;
  border-radius: 8px;
  background: linear-gradient(135deg,#c8a0f0,#a090e8);
  color: #fff;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s;
  white-space: nowrap;
}
.toast-undo:hover { filter: brightness(1.1); transform: translateY(-1px); }
.toast-countdown {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 2px solid var(--text-muted);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 800;
  color: var(--text-secondary);
  flex-shrink: 0;
  position: relative;
}
.toast-countdown svg {
  position: absolute;
  top: -2px; left: -2px;
  width: 28px; height: 28px;
  transform: rotate(-90deg);
}
.toast-countdown svg circle {
  fill: none;
  stroke: var(--filter-active-color);
  stroke-width: 2;
  stroke-linecap: round;
  stroke-dasharray: 75.4;
  stroke-dashoffset: 0;
  transition: stroke-dashoffset 1s linear;
}
@keyframes toastIn {
  0% { opacity: 0; transform: translateY(20px) scale(0.9); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes toastOut {
  0% { opacity: 1; transform: translateY(0) scale(1); }
  100% { opacity: 0; transform: translateY(20px) scale(0.9); }
}
</style>

<script>
/* ══════════════════════════════════════
   PIN Lock Screen — Full Edition
══════════════════════════════════════ */
(function() {
  const PIN_KEY  = 'app_pin';
  const SQ_KEY   = 'app_sq';   // { question, answer }

  // ── 预设安全问题 ──
  const SQ_LIST = [
    '您母亲的名字是？',
    '您的出生城市是？',
    '您的小学名称是？',
    '您的第一只宠物叫什么？',
    '您最喜欢的书名是？',
    '您最喜欢的食物是？',
    '您童年最好的朋友叫什么？',
  ];

  // ── DOM 引用 ──
  const lockScreen  = document.getElementById('lockScreen');
  const lockTitle   = document.getElementById('lockTitle');
  const lockSubtitle= document.getElementById('lockSubtitle');
  const lockIcon    = document.getElementById('lockIcon');
  const lockError   = document.getElementById('lockError');
  const lockHint    = document.getElementById('lockHint');
  const lockNumpad  = document.getElementById('lockNumpad');
  const lockActions = document.getElementById('lockActions');
  const pinDotsEl   = document.getElementById('pinDots');

  const forgotBtn   = document.getElementById('forgotPinBtn');
  const setupSqBtn  = document.getElementById('setupSqBtn');

  // 安全问题（忘记密码用）
  const sqPanel     = document.getElementById('sqPanel');
  const sqQDisplay  = document.getElementById('sqQuestionDisplay');
  const sqAnswerInp = document.getElementById('sqAnswerInput');
  const sqCancelBtn = document.getElementById('sqCancelBtn');
  const sqConfirmBtn= document.getElementById('sqConfirmBtn');

  // 首次设置安全问题
  const sqSetPanel  = document.getElementById('sqSetPanel');
  const sqSetQ      = document.getElementById('sqSetQuestion');
  const sqSetA      = document.getElementById('sqSetAnswer');
  const sqSetSkip   = document.getElementById('sqSetSkipBtn');
  const sqSetSave   = document.getElementById('sqSetSaveBtn');

  let inputPin   = '';
  let isSetMode  = false;
  let tempPin    = '';
  let sqSetStep  = false; // 正在设置安全问题阶段

  // 填充安全问题下拉
  function populateSqOptions(selectEl) {
    selectEl.innerHTML = SQ_LIST.map((q, i) =>
      `<option value="${i}">${q}</option>`
    ).join('');
  }
  populateSqOptions(sqSetQ);

  function enterSetMode() {
    isSetMode = true;
    lockIcon.textContent = '✏️';
    lockTitle.textContent = '设置 PIN 码';
    lockSubtitle.textContent = '请输入 4 位数字作为密码';
    lockHint.innerHTML = '首次使用，请先设置您的专属 PIN 码';
    lockActions.style.display = 'none';
  }

  function resetDots() {
    for (let i = 0; i < 4; i++)
      document.getElementById('dot' + i).className = 'pin-dot';
  }

  function updateDots(len, isErr) {
    for (let i = 0; i < 4; i++) {
      document.getElementById('dot' + i).className =
        'pin-dot' + (i < len ? (isErr ? ' error' : ' filled') : '');
    }
  }

  function showError(msg) {
    lockError.textContent = msg;
    lockError.classList.add('show');
    pinDotsEl.classList.add('shake');
    setTimeout(() => {
      lockError.classList.remove('show');
      pinDotsEl.classList.remove('shake');
    }, 1800);
  }

  function unlock() {
    lockScreen.classList.add('hide');
    setTimeout(() => { lockScreen.style.display = 'none'; }, 480);
  }

  // ── 主输入处理 ──
  function handleInput(num) {
    if (num === 'del') {
      if (inputPin.length > 0) { inputPin = inputPin.slice(0, -1); updateDots(inputPin.length, false); }
      return;
    }
    if (inputPin.length >= 4) return;
    inputPin += num;
    updateDots(inputPin.length, false);
    if (inputPin.length < 4) return;

    const stored = localStorage.getItem(PIN_KEY);

    if (isSetMode) {
      if (!tempPin) {
        tempPin = inputPin; inputPin = ''; resetDots();
        lockSubtitle.textContent = '再次输入确认密码';
        lockHint.innerHTML = '';
      } else {
        if (inputPin === tempPin) {
          localStorage.setItem(PIN_KEY, inputPin);
          // 引导设置安全问题
          enterSqSetPhase();
        } else {
          showError('两次输入不一致，请重新设置');
          tempPin = ''; inputPin = ''; resetDots();
          lockSubtitle.textContent = '请输入 4 位数字作为密码';
        }
      }
    } else {
      if (inputPin === stored) {
        lockIcon.textContent = '✅';
        updateDots(4, false);
        setTimeout(unlock, 500);
      } else {
        updateDots(4, true);
        showError('密码错误，请重试');
        setTimeout(() => { inputPin = ''; resetDots(); }, 700);
      }
    }
  }

  // ── 设置安全问题阶段（PIN 设好后） ──
  let shouldUnlockAfterSq = false;

  function enterSqSetPhase() {
    shouldUnlockAfterSq = true;
    lockNumpad.style.display = 'none';
    pinDotsEl.style.display  = 'none';
    lockHint.innerHTML = '';
    lockIcon.textContent = '🛡️';
    lockTitle.textContent = '设置安全问题';
    lockSubtitle.textContent = '忘记密码时可通过安全问题重置';
    sqSetPanel.classList.add('show');
    lockActions.style.display = 'none';
  }

  sqSetSave.addEventListener('click', () => {
    const ans = sqSetA.value.trim();
    if (!ans) { sqSetA.style.borderColor = '#e07aaa'; setTimeout(() => sqSetA.style.borderColor = '', 1000); return; }
    const idx = Number(sqSetQ.value);
    localStorage.setItem(SQ_KEY, JSON.stringify({ question: idx, answer: ans.toLowerCase() }));
    finishSetup();
  });
  sqSetSkip.addEventListener('click', finishSetup);

  function finishSetup() {
    sqSetPanel.classList.remove('show');
    if (shouldUnlockAfterSq) {
      shouldUnlockAfterSq = false;
      lockIcon.textContent = '🎉';
      lockTitle.textContent = '设置成功！';
      lockSubtitle.textContent = '欢迎使用工作清单';
      setTimeout(unlock, 700);
    } else {
      // 从锁屏页补设安全问题 → 回到输入 PIN 界面
      lockIcon.textContent = '🔒';
      lockTitle.textContent = '工作清单';
      lockSubtitle.textContent = '请输入 PIN 码解锁';
      lockNumpad.style.display = '';
      pinDotsEl.style.display  = '';
      lockActions.style.display = '';
      const sq = JSON.parse(localStorage.getItem(SQ_KEY) || 'null');
      if (sq && setupSqBtn) setupSqBtn.style.display = 'none';
      inputPin = ''; resetDots();
    }
  }

  // ── 忘记密码 ──
  forgotBtn.addEventListener('click', () => {
    const sq = JSON.parse(localStorage.getItem(SQ_KEY) || 'null');
    if (!sq) {
      showError('未设置安全问题，请先点击下方"设置安全问题"');
      return;
    }
    // 显示安全问题面板
    populateSqOptions(sqQDisplay);
    sqQDisplay.value = sq.question;
    sqQDisplay.disabled = true;
    sqAnswerInp.value = '';
    lockNumpad.style.display = 'none';
    pinDotsEl.style.display  = 'none';
    lockActions.style.display = 'none';
    lockHint.innerHTML = '';
    lockSubtitle.textContent = '回答安全问题以重置密码';
    sqPanel.classList.add('show');
  });

  // ── 从锁屏页设置安全问题（无需输入 PIN） ──
  setupSqBtn.addEventListener('click', () => {
    const sq = JSON.parse(localStorage.getItem(SQ_KEY) || 'null');
    if (sq) {
      showError('安全问题已设置，如需修改请在解锁后操作');
      return;
    }
    lockNumpad.style.display = 'none';
    pinDotsEl.style.display  = 'none';
    lockActions.style.display = 'none';
    lockHint.innerHTML = '';
    lockIcon.textContent = '🛡️';
    lockTitle.textContent = '设置安全问题';
    lockSubtitle.textContent = '设置后可通过安全问题重置 PIN 码';
    sqSetA.value = '';
    sqSetPanel.classList.add('show');
  });

  sqCancelBtn.addEventListener('click', () => {
    sqPanel.classList.remove('show');
    lockNumpad.style.display = '';
    pinDotsEl.style.display  = '';
    lockActions.style.display = '';
    lockSubtitle.textContent = '请输入 PIN 码解锁';
    inputPin = ''; resetDots();
  });

  sqConfirmBtn.addEventListener('click', () => {
    const sq  = JSON.parse(localStorage.getItem(SQ_KEY) || 'null');
    const ans = sqAnswerInp.value.trim().toLowerCase();
    if (!ans) { sqAnswerInp.style.borderColor = '#e07aaa'; setTimeout(() => sqAnswerInp.style.borderColor = '', 800); return; }
    if (sq && ans === sq.answer) {
      // 答对 → 进入重设密码流程
      sqPanel.classList.remove('show');
      lockNumpad.style.display = '';
      pinDotsEl.style.display  = '';
      lockActions.style.display = '';
      inputPin = ''; tempPin = ''; resetDots();
      isSetMode = true;
      lockIcon.textContent = '🔓';
      lockTitle.textContent = '重设 PIN 码';
      lockSubtitle.textContent = '请输入新的 4 位 PIN 码';
      lockHint.innerHTML = '';
    } else {
      sqAnswerInp.style.borderColor = '#e07aaa';
      sqAnswerInp.value = '';
      sqAnswerInp.placeholder = '答案不正确，请重试';
      setTimeout(() => {
        sqAnswerInp.style.borderColor = '';
        sqAnswerInp.placeholder = '请输入答案…';
      }, 1500);
    }
  });

  // ── 键盘 / 点击事件 ──
  lockNumpad.addEventListener('click', e => {
    const btn = e.target.closest('.num-btn');
    if (!btn) return;
    handleInput(btn.dataset.num);
  });

  document.addEventListener('keydown', e => {
    if (!lockScreen || lockScreen.style.display === 'none') return;
    if (sqPanel.classList.contains('show') || sqSetPanel.classList.contains('show')) return;
    if (e.key >= '0' && e.key <= '9') handleInput(e.key);
    if (e.key === 'Backspace') handleInput('del');
  });

  // ── 初始化 ──
  const savedPin = localStorage.getItem(PIN_KEY);
  if (!savedPin) {
    lockActions.style.display = 'none';
    enterSetMode();
  } else {
    // 已有 PIN：根据是否设了安全问题显示/隐藏对应按钮
    const sq = JSON.parse(localStorage.getItem(SQ_KEY) || 'null');
    if (sq && setupSqBtn) setupSqBtn.style.display = 'none';
    if (!sq && forgotBtn) forgotBtn.style.opacity = '0.45';
  }
})();

/* ══════════════════════════════════════
   Change PIN Overlay (in-app)
══════════════════════════════════════ */
(function() {
  const PIN_KEY  = 'app_pin';
  const SQ_KEY   = 'app_sq';
  const SQ_LIST  = [
    '您母亲的名字是？','您的出生城市是？','您的小学名称是？',
    '您的第一只宠物叫什么？','您最喜欢的书名是？',
    '您最喜欢的食物是？','您童年最好的朋友叫什么？',
  ];

  const overlay  = document.getElementById('changePinOverlay');
  const cpSub    = document.getElementById('cpSub');
  const cpError  = document.getElementById('cpError');
  const cpNumpad = document.getElementById('cpNumpad');
  const cpClose  = document.getElementById('cpCloseBtn');
  const settBtn  = document.getElementById('settingsBtn');

  let cpInput = '';
  let cpStep  = 'verify'; // verify | new1 | new2 | sq
  let cpOld   = '';
  let cpNew1  = '';

  function cpDot(i) { return document.getElementById('cp-dot' + i); }

  function cpUpdateDots(len, err) {
    for (let i = 0; i < 4; i++)
      cpDot(i).className = 'pin-dot' + (i < len ? (err ? ' error' : ' filled') : '');
  }
  function cpResetDots() {
    for (let i = 0; i < 4; i++) cpDot(i).className = 'pin-dot';
  }

  function cpShowError(msg) {
    cpError.textContent = msg;
    cpError.classList.add('show');
    document.getElementById('cpPinDots').classList.add('shake');
    setTimeout(() => {
      cpError.classList.remove('show');
      document.getElementById('cpPinDots').classList.remove('shake');
    }, 1800);
  }

  function openOverlay() {
    cpStep = 'verify'; cpInput = ''; cpOld = ''; cpNew1 = '';
    cpSub.textContent = '请先验证当前密码';
    cpResetDots();
    cpError.classList.remove('show');
    overlay.classList.add('show');
  }

  function closeOverlay() { overlay.classList.remove('show'); }

  // settBtn click is now handled by the settings-dropdown system (see below)
  cpClose.addEventListener('click', closeOverlay);
  overlay.addEventListener('click', e => { if (e.target === overlay) closeOverlay(); });

  cpNumpad.addEventListener('click', e => {
    const btn = e.target.closest('.num-btn');
    if (!btn) return;
    const num = btn.dataset.num;
    if (num === 'del') {
      if (cpInput.length > 0) { cpInput = cpInput.slice(0, -1); cpUpdateDots(cpInput.length, false); }
      return;
    }
    if (cpInput.length >= 4) return;
    cpInput += num;
    cpUpdateDots(cpInput.length, false);
    if (cpInput.length < 4) return;

    const stored = localStorage.getItem(PIN_KEY);
    if (cpStep === 'verify') {
      if (cpInput === stored) {
        cpOld = cpInput; cpInput = ''; cpResetDots();
        cpStep = 'new1';
        cpSub.textContent = '请输入新的 4 位 PIN 码';
      } else {
        cpUpdateDots(4, true);
        cpShowError('当前密码错误');
        setTimeout(() => { cpInput = ''; cpResetDots(); }, 700);
      }
    } else if (cpStep === 'new1') {
      if (cpInput === cpOld) {
        cpUpdateDots(4, true);
        cpShowError('新密码不能与当前密码相同');
        setTimeout(() => { cpInput = ''; cpResetDots(); }, 700);
        return;
      }
      cpNew1 = cpInput; cpInput = ''; cpResetDots();
      cpStep = 'new2';
      cpSub.textContent = '再次输入新密码确认';
    } else if (cpStep === 'new2') {
      if (cpInput === cpNew1) {
        localStorage.setItem(PIN_KEY, cpInput);
        cpSub.textContent = '✅ 密码已更新！';
        cpUpdateDots(4, false);
        setTimeout(closeOverlay, 800);
      } else {
        cpUpdateDots(4, true);
        cpShowError('两次输入不一致，请重新输入');
        setTimeout(() => {
          cpInput = ''; cpNew1 = ''; cpResetDots();
          cpStep = 'new1';
          cpSub.textContent = '请输入新的 4 位 PIN 码';
        }, 900);
      }
    }
  });

  // 键盘支持
  document.addEventListener('keydown', e => {
    if (!overlay.classList.contains('show')) return;
    if (e.key >= '0' && e.key <= '9') cpNumpad.querySelector(`[data-num="${e.key}"]`)?.click();
    if (e.key === 'Backspace') cpNumpad.querySelector('.del-btn')?.click();
    if (e.key === 'Escape') closeOverlay();
  });
})();

async function fetchWeather() {
  const widget      = document.getElementById('weatherWidget');
  const lockStrip   = document.getElementById('lockWeatherStrip');

  // 英文城市名 → 中文映射
  const CITY_CN = {
    'Beijing':'北京','Shanghai':'上海','Guangzhou':'广州','Shenzhen':'深圳',
    'Tianjin':'天津','Chongqing':'重庆','Chengdu':'成都','Hangzhou':'杭州',
    'Wuhan':'武汉','Nanjing':'南京','Xi\'an':'西安','Suzhou':'苏州',
    'Zhengzhou':'郑州','Changsha':'长沙','Dongguan':'东莞','Qingdao':'青岛',
    'Shenyang':'沈阳','Dalian':'大连','Harbin':'哈尔滨','Jinan':'济南',
    'Fuzhou':'福州','Xiamen':'厦门','Kunming':'昆明','Hefei':'合肥',
    'Changchun':'长春','Taiyuan':'太原','Guiyang':'贵阳','Nanning':'南宁',
    'Lanzhou':'兰州','Urumqi':'乌鲁木齐','Hohhot':'呼和浩特','Lhasa':'拉萨',
    'Ningbo':'宁波','Wuxi':'无锡','Foshan':'佛山','Tangshan':'唐山',
    'Wenzhou':'温州','Haikou':'海口','Zhuhai':'珠海','Yantai':'烟台',
    'Shijiazhuang':'石家庄','Baoding':'保定','Langfang':'廊坊','Handan':'邯郸',
    'Cangzhou':'沧州','Zibo':'淄博','Weifang':'潍坊','Nantong':'南通',
    'Xuzhou':'徐州','Changzhou':'常州','Quanzhou':'泉州','Luoyang':'洛阳',
    'Hunan':'湖南','Hebei':'河北','Jiangsu':'江苏','Zhejiang':'浙江','Anhui':'安徽',
    'Fujian':'福建','Jiangxi':'江西','Shandong':'山东','Henan':'河南',
    'Hubei':'湖北','Hainan':'海南','Sichuan':'四川','Guizhou':'贵州',
    'Yunnan':'云南','Shaanxi':'陕西','Gansu':'甘肃','Qinghai':'青海',
    'Taiwan':'台湾','Inner Mongolia':'内蒙古','Guangxi':'广西','Xizang':'西藏',
    'Ningxia':'宁夏','Xinjiang':'新疆',
  };

  function toCnCity(name) {
    if (!name) return '未知城市';
    return CITY_CN[name] || CITY_CN[name.charAt(0).toUpperCase() + name.slice(1)] || name;
  }

  // ── 方案 1：优先使用浏览器 Geolocation API（精确到当前设备） ──
  function getGeoLocation() {
    return new Promise((resolve) => {
      if (!navigator.geolocation) { resolve(null); return; }
      navigator.geolocation.getCurrentPosition(
        pos => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude }),
        () => resolve(null),           // 用户拒绝或不可用 → 走 IP 定位
        { timeout: 5000, maximumAge: 600000 } // 缓存 10 分钟，避免反复弹授权
      );
    });
  }

  // ── 方案 2：IP 定位 fallback ──
  async function getIpLocation() {
    const IP_APIS = [
      {
        url: 'https://ipwho.is/',
        parse: d => ({ lat: d.latitude, lon: d.longitude, city: toCnCity(d.city || d.region) })
      },
      {
        url: 'https://ip-api.com/json/?fields=lat,lon,city,regionName',
        parse: d => ({ lat: d.lat, lon: d.lon, city: toCnCity(d.city || d.regionName) })
      },
      {
        url: 'https://ipinfo.io/json',
        parse: d => {
          const [lat, lon] = (d.loc || '39.0842,117.2009').split(',').map(Number);
          return { lat, lon, city: toCnCity(d.city || d.region) };
        }
      }
    ];
    for (const api of IP_APIS) {
      try {
        const res = await fetch(api.url, { signal: AbortSignal.timeout(5000) });
        if (!res.ok) continue;
        const data = await res.json();
        const parsed = api.parse(data);
        if (parsed.lat && parsed.lon) return parsed;
      } catch (_) { /* try next */ }
    }
    return { lat: 39.0842, lon: 117.2009, city: '天津' }; // fallback 天津
  }

  // ── 反向地理编码：坐标 → 城市名（用 open-meteo 的 geocoding 或 Nominatim） ──
  async function latlonToCity(lat, lon) {
    try {
      const res = await fetch(
        `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&accept-language=zh`,
        { signal: AbortSignal.timeout(5000) }
      );
      const data = await res.json();
      // 优先取 city，没有则取 town/county
      const addr = data.address || {};
      return addr.city || addr.town || addr.county || addr.state || '未知城市';
    } catch (_) {
      return null;
    }
  }

  let location = null;
  let fallbackCity = null;

  // 先尝试浏览器精确定位
  const geo = await getGeoLocation();
  if (geo) {
    let cityName = await latlonToCity(geo.lat, geo.lon);
    // 反向地理编码失败时，尝试 IP 定位拿城市名
    if (!cityName) {
      try { fallbackCity = (await getIpLocation()).city; } catch(_) {}
    }
    location = { lat: geo.lat, lon: geo.lon, city: cityName || fallbackCity || '未知位置' };
  }

  // 浏览器定位失败或用户拒绝 → 走 IP 定位
  if (!location) {
    location = await getIpLocation();
  }

  try {
    const { lat, lon, city } = location;
    const wRes = await fetch(
      `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weathercode,windspeed_10m&timezone=auto`,
      { signal: AbortSignal.timeout(7000) }
    );
    const wData = await wRes.json();
    const temp = Math.round(wData.current.temperature_2m);
    const code = wData.current.weathercode;
    const desc = wmoCodeToDesc(code);
    const icon = getWeatherIcon(desc);

    // 更新主界面天气
    widget.innerHTML = `
      <span class="weather-icon">${icon}</span>
      <div class="weather-info">
        <span class="weather-temp">${temp}°C</span>
        <span class="weather-desc">${desc}</span>
        <span class="weather-location">📍 ${city}</span>
      </div>`;

    // 同步更新锁屏天气条
    if (lockStrip) {
      lockStrip.innerHTML = `${icon} <b>${temp}°C</b>&nbsp;${desc}&nbsp;<span style="opacity:0.7">📍${city}</span>`;
    }
  } catch (e) {
    widget.innerHTML = `<span class="weather-loading">🌤️ 天气暂不可用</span>`;
    if (lockStrip) lockStrip.innerHTML = `🌤️ 天气获取中…`;
  }
}

function wmoCodeToDesc(code) {
  const map = {
    0:'晴', 1:'基本晴朗', 2:'部分多云', 3:'阴天',
    45:'有雾', 48:'冻雾',
    51:'小毛毛雨', 53:'中毛毛雨', 55:'大毛毛雨',
    61:'小雨', 63:'中雨', 65:'大雨',
    71:'小雪', 73:'中雪', 75:'大雪', 77:'冰粒',
    80:'小阵雨', 81:'中阵雨', 82:'强阵雨',
    85:'小阵雪', 86:'强阵雪',
    95:'雷阵雨', 96:'雷阵雨夹冰雹', 99:'强雷暴'
  };
  return map[code] || '多云';
}

const taskInput      = document.getElementById('taskInput');
const noteInput      = document.getElementById('noteInput');
const addBtn         = document.getElementById('addBtn');
const taskList       = document.getElementById('taskList');
const prioritySelect = document.getElementById('prioritySelect');
const toggleNoteBtn  = document.getElementById('toggleNoteInput');
const noteInputWrap  = document.getElementById('noteInputWrap');

let tasks         = JSON.parse(localStorage.getItem('tasks') || '[]');
let currentFilter = 'all';
let expandedTasks = new Set(JSON.parse(localStorage.getItem('expandedTasks') || '[]'));
let editingTasks  = new Set();

const priorityLabel = { high: '高', medium: '中', low: '低' };

function save() {
  localStorage.setItem('tasks', JSON.stringify(tasks));
  localStorage.setItem('expandedTasks', JSON.stringify([...expandedTasks]));
}

function updateStats() {
  const total = tasks.length;
  const done  = tasks.filter(t => t.done).length;
  document.getElementById('count-all').textContent     = total;
  document.getElementById('count-pending').textContent = total - done;
  document.getElementById('count-done').textContent    = done;
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}

function buildNoteHtml(t) {
  const isEditing = editingTasks.has(t.id);
  const hasNote   = t.note && t.note.trim().length > 0;

  if (isEditing) {
    return `
      <div class="task-note-edit">
        <textarea placeholder="具体步骤、注意事项…">${escapeHtml(t.note)}</textarea>
        <div class="note-edit-actions">
          <button class="note-ghost-btn" data-action="cancel-note">取消</button>
          <button class="note-save-btn"  data-action="save-note">保存</button>
        </div>
      </div>`;
  }
  if (hasNote) {
    return `
      <div class="task-note-display md-content">${renderMarkdown(t.note)}</div>
      <div class="note-edit-actions" style="margin-top:8px;">
        <button class="note-ghost-btn" data-action="edit-note">编辑备注</button>
      </div>`;
  }
  return `
    <div class="task-note-empty-hint">暂无备注</div>
    <div class="note-edit-actions" style="margin-top:6px;">
      <button class="note-ghost-btn" data-action="close-note">收起</button>
      <button class="note-save-btn"  data-action="open-edit-note">+ 添加备注</button>
    </div>`;
}

function render() {
  updateStats();

  const filtered = tasks.filter(t => {
    if (currentFilter === 'pending') return !t.done;
    if (currentFilter === 'done')    return  t.done;
    if (currentFilter === 'high')    return t.priority === 'high' && !t.done;
    return true;
  });

  if (filtered.length === 0) {
    taskList.innerHTML = `
      <div class="empty">
        <div class="icon">${currentFilter === 'done' ? '🎉' : '✨'}</div>
        <div>${currentFilter === 'done' ? '还没有已完成的任务' : '暂无任务，添加一个吧'}</div>
      </div>`;
    return;
  }

  const order = { high: 0, medium: 1, low: 2 };
  filtered.sort((a, b) => {
    if (a.done !== b.done) return a.done ? 1 : -1;
    return order[a.priority] - order[b.priority];
  });

  taskList.innerHTML = filtered.map(t => {
    const isExpanded = expandedTasks.has(t.id);
    const hasNote    = t.note && t.note.trim().length > 0;
    return `
    <div class="task-item" data-id="${t.id}" data-priority="${t.priority}">
      <div class="checkbox ${t.done ? 'checked' : ''}" data-action="toggle"></div>
      <div class="task-content">
        <div class="task-main" data-action="expand">
          <span class="task-text ${t.done ? 'done' : ''}">${escapeHtml(t.text)}</span>
          ${hasNote ? '<span class="note-indicator" title="点击展开备注">📝</span>' : ''}
        </div>
        <div class="task-note ${isExpanded ? 'open' : ''}">
          ${isExpanded ? buildNoteHtml(t) : ''}
        </div>
      </div>
      <div class="priority-switch" data-action="priority" data-id="${t.id}">
        <button class="priority-switch-btn ps-${t.priority}">${priorityLabel[t.priority]} <span class="ps-arrow">▾</span></button>
        <div class="priority-dropdown">
          <button data-p="high"   class="${t.priority==='high'?'current':''}"><span class="dd-dot dd-dot-high"></span>高优先</button>
          <button data-p="medium" class="${t.priority==='medium'?'current':''}"><span class="dd-dot dd-dot-medium"></span>中优先</button>
          <button data-p="low"    class="${t.priority==='low'?'current':''}"><span class="dd-dot dd-dot-low"></span>低优先</button>
        </div>
      </div>
      <button class="delete-btn" data-action="delete" title="删除">✕</button>
    </div>`;
  }).join('');

  // Re-apply search filter after render
  if (searchQuery) applySearchFilter();
}

/* Add task */
function addTask() {
  const text = taskInput.value.trim();
  if (!text) { taskInput.classList.add('shake'); setTimeout(() => taskInput.classList.remove('shake'), 350); return; }
  tasks.unshift({
    id: Date.now(),
    text,
    note: noteInput.value.trim(),
    done: false,
    priority: prioritySelect.value,
    createdAt: new Date().toISOString()
  });
  taskInput.value = '';
  noteInput.value = '';
  noteInputWrap.classList.remove('open');
  toggleNoteBtn.textContent = '📎 添加备注（可选）';
  save();
  render();
}

/* Task list delegation */
taskList.addEventListener('click', e => {
  const item = e.target.closest('.task-item');
  if (!item) return;
  const id = Number(item.dataset.id);

  if (e.target.closest('[data-action="toggle"]')) {
    const checkbox = e.target.closest('.checkbox');
    const t = tasks.find(t => t.id === id);
    if (t) {
      // 波纹动画
      if (checkbox) {
        const ripple = document.createElement('span');
        ripple.classList.add('ripple');
        checkbox.appendChild(ripple);
        ripple.addEventListener('animationend', () => ripple.remove());
      }
      t.done = !t.done; save(); render();
    }
    return;
  }

  if (e.target.closest('[data-action="delete"]')) {
    // Undo-able delete with toast
    const t = tasks.find(t => t.id === id);
    if (!t) return;
    const deletedTask = { ...t };
    const deletedIndex = tasks.indexOf(t);
    // Immediately remove from view
    item.classList.add('removing');
    setTimeout(() => {
      tasks = tasks.filter(tt => tt.id !== id);
      expandedTasks.delete(id); editingTasks.delete(id);
      save(); render();
      // Re-apply search filter if active
      if (searchQuery) applySearchFilter();
      // Show undo toast
      showToast('已删除任务', {
        duration: 5000,
        undoCallback: () => {
          tasks.splice(deletedIndex, 0, deletedTask);
          save(); render();
          if (searchQuery) applySearchFilter();
        }
      });
    }, 300);
    return;
  }

  // ── 关闭所有已打开的优先级下拉 ──
  function closeAllDropdowns() {
    document.querySelectorAll('.priority-dropdown.show').forEach(d => {
      d.classList.remove('show');
      d.closest('.task-item')?.classList.remove('dropdown-open');
    });
  }

  // ── 选择优先级（必须在切换下拉之前判断，因为下拉是 .priority-switch 的子元素）──
  if (e.target.closest('.priority-dropdown button')) {
    e.stopPropagation();
    const btn = e.target.closest('.priority-dropdown button');
    const newP = btn.dataset.p;
    const t = tasks.find(t => t.id === id);
    if (t && t.priority !== newP) {
      t.priority = newP;
      save();
      render();
    } else {
      closeAllDropdowns();
    }
    return;
  }

  // ── 切换优先级下拉 ──
  if (e.target.closest('[data-action="priority"]')) {
    e.stopPropagation();
    const sw = e.target.closest('.priority-switch');
    const dd = sw.querySelector('.priority-dropdown');
    const wasOpen = dd.classList.contains('show');
    closeAllDropdowns();
    if (!wasOpen) {
      dd.classList.add('show');
      item.classList.add('dropdown-open');
    }
    return;
  }

  if (e.target.closest('[data-action="expand"]')) {
    if (expandedTasks.has(id)) {
      expandedTasks.delete(id); editingTasks.delete(id);
    } else {
      expandedTasks.add(id);
      const t = tasks.find(t => t.id === id);
      if (!t || !t.note || !t.note.trim()) editingTasks.add(id);
    }
    save(); render();
    return;
  }

  if (e.target.closest('[data-action="close-note"]')) {
    expandedTasks.delete(id); editingTasks.delete(id); render(); return;
  }

  if (e.target.closest('[data-action="edit-note"]') || e.target.closest('[data-action="open-edit-note"]')) {
    editingTasks.add(id); render();
    const el = taskList.querySelector(`[data-id="${id}"] .task-note textarea`);
    if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    return;
  }

  if (e.target.closest('[data-action="save-note"]')) {
    const t  = tasks.find(t => t.id === id);
    if (!t) return;
    const ta = item.querySelector('.task-note textarea');
    t.note   = ta ? ta.value.trim() : '';
    editingTasks.delete(id);
    if (!t.note) expandedTasks.delete(id);
    save(); render(); return;
  }

  if (e.target.closest('[data-action="cancel-note"]')) {
    editingTasks.delete(id);
    const t = tasks.find(t => t.id === id);
    if (!t || !t.note || !t.note.trim()) expandedTasks.delete(id);
    render(); return;
  }
});
